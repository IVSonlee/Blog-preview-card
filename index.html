<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32x32.png">
  <link rel="stylesheet" href="CSS/blog_preview_card.css"><!--This serve as a link to external css-->
  
  <title>Frontend Mentor | Blog preview card</title>
</head>
<body>
  <main><!--Using main as the container of all the contents-->
    <div class="card"><!--To serve as container for the blog image that can make the image to center align it-->
      <img src="images/illustration-article.svg" alt="Blog image illustration-article">
    </div>
    
    <article><!--This will serve as comtainer for the text-->
      <h5>Learning</h5>
      <p class="date">Published 21 Dec 2023</p>
      <h2>HTML & CSS foundations</h2>
      <p>These languages are the backbone of every website, defining structure, content, and presentation.</p>
    </article>

    <div class="author_container">
      <img src="images/image-avatar.webp" alt="Image avatar">
      <span>Greg Hooper</span>
    </div>
  </main>
</body>
</html>
